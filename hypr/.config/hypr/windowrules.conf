# Walker launcher
layerrule = blur on, match:namespace walker
layerrule = no_anim off, match:namespace walker
layerrule = animation fade, match:namespace walker

# Scratchpads
windowrule = workspace special:scratchterm silent, match:title ^__scratchterm$
windowrule = float on, match:title ^__scratchterm$
windowrule = size 930 510, match:title ^__scratchterm$
windowrule = center on, match:title ^__scratchterm$

windowrule = workspace special:nvim silent, match:title ^__scratchnvim$
windowrule = float on, match:title ^__scratchnvim$
windowrule = size 1024 570, match:title ^__scratchnvim$
windowrule = center on, match:title ^__scratchnvim$

windowrule = workspace special:herdr silent, match:title ^__scratchherdr$
windowrule = float on, match:title ^__scratchherdr$
windowrule = size 1024 570, match:title ^__scratchherdr$
windowrule = center on, match:title ^__scratchherdr$

windowrule = workspace special:work-nvim silent, match:title ^__scratchwork$
windowrule = float on, match:title ^__scratchwork$
windowrule = size 1024 570, match:title ^__scratchwork$
windowrule = center on, match:title ^__scratchwork$

windowrule = workspace special:keys silent, match:title ^__scratchkeys$
windowrule = float on, match:title ^__scratchkeys$
windowrule = size 1024 570, match:title ^__scratchkeys$
windowrule = center on, match:title ^__scratchkeys$

windowrule = workspace special:ikhal silent, match:title ^__scratchikhal$
windowrule = float on, match:title ^__scratchikhal$
windowrule = size 1024 570, match:title ^__scratchikhal$
windowrule = center on, match:title ^__scratchikhal$

windowrule = workspace special:spotify silent, match:title ^__scratchspotify$
windowrule = float on, match:title ^__scratchspotify$
windowrule = size 1024 570, match:title ^__scratchspotify$
windowrule = center on, match:title ^__scratchspotify$


# khal calendar popup
windowrule = float on, match:class ^org.khal.calendar$
windowrule = size 700 420, match:class ^org.khal.calendar$
windowrule = move 100%-715 35, match:class ^org.khal.calendar$
windowrule = animation slide, match:class ^org.khal.calendar$

# Spotify player — scratchpad (Super+M)
windowrule = workspace special:spotify silent, match:class ^spotify-player$
windowrule = float on, match:class ^spotify-player$
windowrule = size 1100 650, match:class ^spotify-player$
windowrule = center on, match:class ^spotify-player$
windowrule = animation slide, match:class ^spotify-player$

