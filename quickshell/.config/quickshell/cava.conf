; Raw spectrum for Visualizer.qml: one line per frame, bar heights 0-100 separated by ';'.
[general]
bars = 36
framerate = 30
sleep_timer = 1

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
